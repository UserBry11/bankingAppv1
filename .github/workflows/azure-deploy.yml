name: Build and Deploy to Azure Web App
on:
  push:
    branches:
      - main #This fires the pipeline everytime you push code to main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Pull down my latest code into the GitHub virtual builder environment
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Step 2: Setup your runtime environment (Example using Node.js)
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Change to match your exact version

    - name: Build React Frontend
      run: |
        cd fullstackapp-frontend
        npm install
        npm run build

    - name: Copy Frontend to Spring Boot Static Resources
      run: |
        mkdir -p bankingApp/src/main/resources/static
        cp -r fullstackapp-frontend/build/* bankingApp/src/main/resources/static/ || cp -r fullstackapp-frontend/dist/* bankingApp/src/main/resources/static/

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: |
        cd bankingApp
        mvn clean package -DskipTests
    
    - name: Deploy to Azure to Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'my-banking-app'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: 'bankingApp/target/*.jar'
